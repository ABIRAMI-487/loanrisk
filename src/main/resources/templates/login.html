<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f6f8; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 32px; border-radius: 8px; width: 320px;
                     box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
        h2 { text-align: center; color: #1f2937; }
        label { display: block; margin-top: 14px; font-weight: bold; color: #374151; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
                border: 1px solid #d1d5db; border-radius: 4px; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #2563eb; color: white;
                 border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .error { color: #dc2626; text-align: center; margin-top: 10px; }
        .hint { font-size: 12px; color: #6b7280; text-align: center; margin-top: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔒 Admin Login</h2>
    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p class="error" th:if="${param.error}">Invalid username or password.</p>
    <p class="hint">Default: admin / admin123</p>
</div>

</body>
</html>
