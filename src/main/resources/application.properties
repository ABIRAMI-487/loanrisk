spring.application.name=loanrisk

# H2 in-memory database (no setup needed, resets on restart)
spring.datasource.url=jdbc:h2:mem:loanriskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional: enable H2 web console at /h2-console (username: sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# ---- Email config (for auto alerts on LATE/MISSED EMI) ----
# 1. Use a Gmail account. Enable 2FA, then generate an "App Password":
#    Google Account -> Security -> 2-Step Verification -> App Passwords
# 2. Fill in your Gmail address and the 16-character App Password below.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Gemini API config (used only to write email wording & plain-English
# risk explanations — the risk decision itself stays rule-based) ----
# Get a free key at: https://aistudio.google.com/app/apikey
# Pass via environment variable GEMINI_API_KEY or set value below
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.model=gemini-3.6-flash

